# Render "Blueprint": describes the demo service so it can be created in a few clicks.
# Free plan: the service sleeps after 15 idle minutes and takes about a minute to wake.
# Rooms live in memory, so a restart or sleep ends them. Use made-up content only.
services:
  - type: web
    name: therapy-play-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.21.0"
      - key: DEMO
        value: "1"
      # For a real (non-demo) site, remove DEMO and add the passcode as a secret that is set in
      # the Render dashboard, not in this file:
      #   - key: HOST_PASSCODE
      #     sync: false
